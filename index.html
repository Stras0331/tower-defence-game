<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>极简塔防</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
            background: #1a1a2e;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            background: #16213e;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        #info-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 8px 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 13px;
            z-index: 10;
            min-height: 40px;
            flex-shrink: 0;
            pointer-events: none;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 3px;
            font-weight: bold;
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
            background: #0f3460;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: pointer;
        }
        
        #ui-overlay {
            background: rgba(22, 33, 62, 0.95);
            padding: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            z-index: 10;
            min-height: 70px;
            flex-shrink: 0;
            overflow-y: auto;
            max-height: 35vh;
        }
        
        .tower-btn {
            padding: 6px 4px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 10px;
            cursor: pointer;
            text-align: center;
            min-width: 48px;
            min-height: 48px;
            flex: 1;
            max-width: 60px;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            position: relative;
        }
        
        .tower-btn:active {
            transform: scale(0.9);
        }
        
        .tower-btn.selected {
            border-color: #ffd700;
            background-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
        
        .tower-icon {
            font-size: 20px;
            line-height: 1;
        }
        
        .tower-name {
            font-size: 9px;
            font-weight: bold;
            line-height: 1;
        }
        
        .tower-cost {
            font-size: 8px;
            color: #ffd700;
            line-height: 1;
        }
        
        .action-btn {
            padding: 6px 4px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            min-width: 48px;
            min-height: 48px;
            flex: 1;
            max-width: 60px;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }
        
        .action-btn:active {
            transform: scale(0.9);
        }
        
        .action-icon {
            font-size: 20px;
            line-height: 1;
        }
        
        .action-text {
            font-size: 9px;
            line-height: 1;
        }
        
        #message-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
        }
        
        #message-overlay.active {
            display: flex;
        }
        
        #message-content {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            max-width: 85%;
            width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        #message-text {
            color: #333;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            white-space: pre-line;
        }
        
        #message-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .message-btn {
            padding: 12px 15px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            min-height: 44px;
            width: 100%;
        }
        
        .message-btn:active {
            transform: scale(0.95);
        }
        
        .message-btn.secondary {
            background: #95a5a6;
        }
        
        .message-btn.danger {
            background: #e74c3c;
        }
        
        .message-btn.success {
            background: #27ae60;
        }
        
        #toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: center;
            max-width: 80%;
        }
        
        #toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info-bar">
            <div class="info-item">💰<span id="gold">200</span></div>
            <div class="info-item">🌊<span id="wave">0/12</span></div>
            <div class="info-item">❤️<span id="core-hp">1000</span></div>
            <div class="info-item">⏱️<span id="prep-time">待开始</span></div>
        </div>
        
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div id="ui-overlay"></div>
        
        <div id="message-overlay">
            <div id="message-content">
                <div id="message-text"></div>
                <div id="message-buttons"></div>
            </div>
        </div>
        
        <div id="toast"></div>
    </div>
    
    <script>
        console.log('游戏启动中...');
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let GRID_SIZE, COLS, ROWS, offsetX, offsetY;
        
        function setupCanvas() {
            const container = document.getElementById('canvas-container');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            canvas.width = containerWidth;
            canvas.height = containerHeight;
            canvas.style.width = containerWidth + 'px';
            canvas.style.height = containerHeight + 'px';
            
            COLS = 10;
            ROWS = 13;
            
            GRID_SIZE = Math.floor(Math.min(
                (containerWidth - 4) / COLS,
                (containerHeight - 4) / ROWS
            ));
            
            GRID_SIZE = Math.max(GRID_SIZE, 20);
            
            offsetX = (containerWidth - COLS * GRID_SIZE) / 2;
            offsetY = (containerHeight - ROWS * GRID_SIZE) / 2;
        }
        
        const TOWER_TYPES = {
            CANNON: { name: '炮塔', cost: 100, color: '#3498db', icon: '🔫', attack: 20, speed: 1, range: 3 },
            SOLAR: { name: '太阳能', cost: 50, color: '#f1c40f', icon: '☀️', productionRate: 10, productionSpeed: 2 },
            SWORD: { name: '剑士', cost: 80, color: '#e74c3c', icon: '⚔️', attack: 35, speed: 1.5, range: 1.5 },
            WALL: { name: '城墙', cost: 40, color: '#95a5a6', icon: '🧱', hp: 300, defense: 30 },
            ICE: { name: '冰冻', cost: 120, color: '#1abc9c', icon: '❄️', attack: 10, speed: 0.8, range: 2.5, slowEffect: 0.5 },
            SNIPER: { name: '狙击', cost: 150, color: '#9b59b6', icon: '🎯', attack: 50, speed: 0.5, range: 5 }
        };
        
        const ENEMY_TYPES = {
            INFANTRY: { hp: 50, speed: 1, reward: 20, color: '#2ecc71', size: 8, attack: 10 },
            RUNNER: { hp: 30, speed: 2, reward: 25, color: '#3498db', size: 6, attack: 5 },
            TANK: { hp: 150, speed: 0.5, reward: 40, color: '#7f8c8d', size: 12, attack: 15 },
            ELITE_WARRIOR: { hp: 200, speed: 1.2, reward: 80, color: '#e67e22', size: 10, attack: 20 },
            ELITE_TANK: { hp: 400, speed: 0.4, reward: 100, color: '#8e44ad', size: 15, attack: 30 },
            BOSS: { hp: 2000, speed: 0.3, reward: 1000, color: '#c0392b', size: 25, attack: 100 }
        };
        
        const path = [
            {x: 0, y: 1}, {x: 2, y: 1}, {x: 2, y: 3}, {x: 4, y: 3},
            {x: 4, y: 1}, {x: 6, y: 1}, {x: 6, y: 5}, {x: 3, y: 5},
            {x: 3, y: 8}, {x: 5, y: 8}, {x: 5, y: 11}, {x: 5, y: 12}
        ];
        
        let gameState = {
            gold: 200,
            coreHp: 1000,
            coreMaxHp: 1000,
            wave: 0,
            maxWave: 12,
            preparationTime: 30,
            waveActive: false,
            gameStarted: false,
            enemies: [],
            towers: [],
            selectedTowerType: null,
            selectedTower: null,
            gameOver: false,
            victory: false,
            spawnTimer: 0,
            enemiesSpawned: 0,
            enemiesPerWave: 0
        };
        
        class Tower {
            constructor(type, gridX, gridY) {
                this.type = type;
                this.gridX = gridX;
                this.gridY = gridY;
                this.level = 1;
                this.x = gridX * GRID_SIZE + GRID_SIZE / 2;
                this.y = gridY * GRID_SIZE + GRID_SIZE / 2;
                this.attackCooldown = 0;
                
                const config = TOWER_TYPES[type];
                
                this.maxHp = 100;
                this.hp = 100;
                this.defense = 5;
                
                if (config.attack) this.attack = config.attack;
                if (config.speed) this.attackSpeed = config.speed;
                if (config.range) this.range = config.range * GRID_SIZE;
                if (config.productionRate) this.productionRate = config.productionRate;
                if (config.productionSpeed) this.productionSpeed = config.productionSpeed;
                if (config.slowEffect) this.slowEffect = config.slowEffect;
                if (config.hp) {
                    this.maxHp = config.hp;
                    this.hp = config.hp;
                }
                if (config.defense) this.defense = config.defense;
            }
            
            upgrade() {
                if (this.level < 3) {
                    this.level++;
                    this.maxHp *= 2;
                    this.hp = this.maxHp;
                    if (this.attack) this.attack *= 2;
                    if (this.attackSpeed) this.attackSpeed *= 1.5;
                    if (this.range) this.range *= 1.2;
                    if (this.productionRate) this.productionRate *= 2;
                    if (this.productionSpeed) this.productionSpeed *= 1.5;
                    this.defense *= 2;
                    return true;
                }
                return false;
            }
            
            takeDamage(damage) {
                const actualDamage = Math.max(1, damage - this.defense);
                this.hp -= actualDamage;
                return this.hp > 0;
            }
        }
        
        class Enemy {
            constructor(type, wave) {
                this.type = type;
                const config = ENEMY_TYPES[type];
                const waveMultiplier = 1 + (wave - 1) * 0.2;
                
                this.maxHp = config.hp * waveMultiplier;
                this.hp = this.maxHp;
                this.speed = config.speed * GRID_SIZE / 40;
                this.attack = config.attack;
                this.reward = config.reward;
                this.size = config.size;
                this.color = config.color;
                this.defense = type === 'BOSS' ? 20 : (type.includes('ELITE') ? 10 : 0);
                
                this.pathIndex = 0;
                this.x = path[0].x * GRID_SIZE + GRID_SIZE / 2;
                this.y = path[0].y * GRID_SIZE + GRID_SIZE / 2;
                this.alive = true;
                this.reachedCore = false;
                this.slowTimer = 0;
                this.originalSpeed = this.speed;
                this.targetTower = null;
                this.attackCooldown = 0;
            }
            
            move(towers) {
                if (this.slowTimer > 0) {
                    this.slowTimer--;
                    if (this.slowTimer === 0) {
                        this.speed = this.originalSpeed;
                    }
                }
                
                if (this.pathIndex < path.length - 1) {
                    if (this.targetTower && this.targetTower.hp > 0) {
                        if (this.attackCooldown <= 0) {
                            const towerAlive = this.targetTower.takeDamage(this.attack);
                            this.attackCooldown = 60;
                            if (!towerAlive) {
                                this.targetTower = null;
                            }
                        } else {
                            this.attackCooldown--;
                        }
                        return;
                    }
                    
                    for (const tower of towers) {
                        if (tower.type === 'WALL' && tower.hp > 0) {
                            const dist = Math.sqrt(
                                Math.pow(tower.x - this.x, 2) + 
                                Math.pow(tower.y - this.y, 2)
                            );
                            if (dist < GRID_SIZE) {
                                this.targetTower = tower;
                                return;
                            }
                        }
                    }
                    
                    const target = path[this.pathIndex + 1];
                    const targetX = target.x * GRID_SIZE + GRID_SIZE / 2;
                    const targetY = target.y * GRID_SIZE + GRID_SIZE / 2;
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist <= this.speed) {
                        this.x = targetX;
                        this.y = targetY;
                        this.pathIndex++;
                        if (this.pathIndex >= path.length - 1) {
                            this.reachedCore = true;
                        }
                    } else {
                        this.x += (dx / dist) * this.speed;
                        this.y += (dy / dist) * this.speed;
                    }
                }
            }
            
            takeDamage(damage) {
                const actualDamage = Math.max(1, damage - this.defense);
                this.hp -= actualDamage;
            }
        }
        
        function showToast(message, duration = 1500) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }
        
        function initUI() {
            const uiOverlay = document.getElementById('ui-overlay');
            uiOverlay.innerHTML = '';
            
            for (const [type, config] of Object.entries(TOWER_TYPES)) {
                const btn = document.createElement('div');
                btn.className = 'tower-btn';
                btn.style.backgroundColor = config.color;
                btn.innerHTML = `
                    <span class="tower-icon">${config.icon}</span>
                    <span class="tower-name">${config.name}</span>
                    <span class="tower-cost">$${config.cost}</span>
                `;
                btn.onclick = () => selectTower(type);
                uiOverlay.appendChild(btn);
            }
            
            const divider = document.createElement('div');
            divider.style.width = '100%';
            divider.style.height = '1px';
            divider.style.backgroundColor = 'rgba(255,255,255,0.2)';
            uiOverlay.appendChild(divider);
            
            const shopBtn = document.createElement('div');
            shopBtn.className = 'action-btn';
            shopBtn.style.backgroundColor = '#e67e22';
            shopBtn.innerHTML = '<span class="action-icon">🛒</span><span class="action-text">商店</span>';
            shopBtn.onclick = openShop;
            uiOverlay.appendChild(shopBtn);
            
            const startBtn = document.createElement('div');
            startBtn.className = 'action-btn';
            startBtn.style.backgroundColor = '#27ae60';
            startBtn.style.minWidth = '70px';
            startBtn.style.maxWidth = '80px';
            startBtn.innerHTML = '<span class="action-icon">▶️</span><span class="action-text">开始</span>';
            startBtn.onclick = startWave;
            uiOverlay.appendChild(startBtn);
            
            const restartBtn = document.createElement('div');
            restartBtn.className = 'action-btn';
            restartBtn.style.backgroundColor = '#c0392b';
            restartBtn.innerHTML = '<span class="action-icon">🔄</span><span class="action-text">重开</span>';
            restartBtn.onclick = restartGame;
            uiOverlay.appendChild(restartBtn);
        }
        
        function selectTower(type) {
            if (gameState.selectedTowerType === type) {
                gameState.selectedTowerType = null;
                showToast('已取消选择');
            } else {
                gameState.selectedTowerType = type;
                gameState.selectedTower = null;
                showToast(`选择${TOWER_TYPES[type].name}`);
            }
            updateUI();
        }
        
        function openShop() {
            const overlay = document.getElementById('message-overlay');
            const text = document.getElementById('message-text');
            const buttons = document.getElementById('message-buttons');
            
            overlay.classList.add('active');
            text.textContent = '🛒 商店';
            buttons.innerHTML = '';
            
            const items = [
                { name: '💰 金币+100', cost: 50, btnClass: 'success', action: () => { 
                    gameState.gold += 100; 
                    showToast('获得100金币！');
                }},
                { name: '⚔️ 攻击+50%', cost: 100, btnClass: '', action: () => { 
                    gameState.towers.forEach(t => { if (t.attack) t.attack = Math.floor(t.attack * 1.5); }); 
                    showToast('攻击力提升50%！');
                }},
                { name: '❤️ 核心+300', cost: 75, btnClass: 'danger', action: () => { 
                    gameState.coreHp = Math.min(gameState.coreMaxHp, gameState.coreHp + 300); 
                    showToast('核心恢复300生命！');
                }}
            ];
            
            items.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = `message-btn ${item.btnClass}`;
                btn.textContent = `${item.name} ($${item.cost})`;
                btn.onclick = () => {
                    if (gameState.gold >= item.cost) {
                        gameState.gold -= item.cost;
                        item.action();
                        updateUI();
                    } else {
                        showToast('金币不足！');
                    }
                };
                buttons.appendChild(btn);
            });
            
            const closeBtn = document.createElement('button');
            closeBtn.className = 'message-btn secondary';
            closeBtn.textContent = '关闭';
            closeBtn.onclick = () => {
                overlay.classList.remove('active');
            };
            buttons.appendChild(closeBtn);
        }
        
        function updateUI() {
            document.getElementById('gold').textContent = Math.floor(gameState.gold);
            document.getElementById('wave').textContent = `${gameState.wave}/${gameState.maxWave}`;
            document.getElementById('core-hp').textContent = Math.floor(gameState.coreHp);
            
            const prepTimeEl = document.getElementById('prep-time');
            if (!gameState.gameStarted) {
                prepTimeEl.textContent = '待开始';
            } else if (!gameState.waveActive && !gameState.gameOver && !gameState.victory) {
                prepTimeEl.textContent = `${Math.ceil(gameState.preparationTime)}s`;
            } else {
                prepTimeEl.textContent = '战斗中';
            }
            
            const buttons = document.querySelectorAll('.tower-btn');
            buttons.forEach((btn, i) => {
                const types = Object.keys(TOWER_TYPES);
                if (types[i] === gameState.selectedTowerType) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }
        
        function startWave() {
            if (gameState.gameOver || gameState.victory) {
                showToast('游戏已结束，请重新开始');
                return;
            }
            
            if (!gameState.waveActive) {
                if (!gameState.gameStarted) {
                    gameState.gameStarted = true;
                    showToast('🎮 游戏开始！');
                }
                
                gameState.wave++;
                gameState.waveActive = true;
                gameState.enemies = [];
                gameState.enemiesSpawned = 0;
                gameState.spawnTimer = 0;
                
                if (gameState.wave === gameState.maxWave) {
                    gameState.enemiesPerWave = 1;
                    showToast('⚠️ Boss来袭！');
                } else {
                    gameState.enemiesPerWave = 5 + gameState.wave * 2;
                    showToast(`第${gameState.wave}波开始！`);
                }
                updateUI();
            } else {
                showToast('当前波次进行中！');
            }
        }
        
        function spawnEnemy() {
            let enemyType;
            const wave = gameState.wave;
            
            if (wave <= 3) {
                const types = ['INFANTRY', 'INFANTRY', 'RUNNER'];
                enemyType = types[Math.floor(Math.random() * types.length)];
            } else if (wave <= 6) {
                const types = ['INFANTRY', 'RUNNER', 'TANK'];
                enemyType = types[Math.floor(Math.random() * types.length)];
            } else if (wave <= 8) {
                const types = ['TANK', 'ELITE_WARRIOR', 'RUNNER'];
                enemyType = types[Math.floor(Math.random() * types.length)];
            } else if (wave <= 10) {
                const types = ['ELITE_WARRIOR', 'ELITE_TANK', 'TANK'];
                enemyType = types[Math.floor(Math.random() * types.length)];
            } else if (wave === 11) {
                const types = ['ELITE_WARRIOR', 'ELITE_TANK'];
                enemyType = types[Math.floor(Math.random() * types.length)];
            } else {
                enemyType = 'BOSS';
            }
            
            gameState.enemies.push(new Enemy(enemyType, wave));
        }
        
        function updateGame() {
            if (gameState.gameOver || gameState.victory) return;
            
            if (!gameState.gameStarted) {
                return;
            }
            
            if (!gameState.waveActive) {
                if (gameState.preparationTime > 0) {
                    gameState.preparationTime -= 1/60;
                    if (gameState.preparationTime <= 0) {
                        startWave();
                        gameState.preparationTime = 30;
                    }
                }
            } else {
                gameState.spawnTimer++;
                if (gameState.enemiesSpawned < gameState.enemiesPerWave) {
                    const spawnInterval = gameState.wave === gameState.maxWave ? 1 : 30;
                    if (gameState.spawnTimer >= spawnInterval) {
                        spawnEnemy();
                        gameState.enemiesSpawned++;
                        gameState.spawnTimer = 0;
                    }
                }
                
                for (const enemy of gameState.enemies) {
                    if (enemy.alive) {
                        enemy.move(gameState.towers);
                        if (enemy.reachedCore) {
                            gameState.coreHp -= enemy.attack;
                            enemy.alive = false;
                            if (gameState.coreHp <= 0) {
                                gameState.coreHp = 0;
                                gameState.gameOver = true;
                                showGameOver();
                            }
                        } else if (enemy.hp <= 0) {
                            gameState.gold += enemy.reward;
                            enemy.alive = false;
                        }
                    }
                }
                
                gameState.enemies = gameState.enemies.filter(e => e.alive);
                updateTowers();
                
                if (gameState.enemiesSpawned >= gameState.enemiesPerWave && 
                    gameState.enemies.length === 0) {
                    gameState.waveActive = false;
                    gameState.preparationTime = 30;
                    if (gameState.wave >= gameState.maxWave) {
                        gameState.victory = true;
                        showVictory();
                    } else {
                        showToast(`第${gameState.wave}波完成！准备下一波`);
                    }
                }
            }
        }
        
        function updateTowers() {
            for (const tower of gameState.towers) {
                if (tower.attackCooldown > 0) {
                    tower.attackCooldown--;
                }
                
                if (tower.type === 'SOLAR') {
                    if (Math.random() < tower.productionSpeed / 60) {
                        gameState.gold += tower.productionRate;
                    }
                } else if (tower.type !== 'WALL') {
                    if (tower.attackCooldown <= 0) {
                        const target = findTarget(tower);
                        if (target) {
                            target.takeDamage(tower.attack);
                            if (tower.type === 'ICE') {
                                target.slowTimer = 120;
                                target.originalSpeed = target.speed;
                                target.speed *= tower.slowEffect;
                            }
                            tower.attackCooldown = Math.floor(60 / tower.attackSpeed);
                        }
                    }
                }
            }
        }
        
        function findTarget(tower) {
            for (const enemy of gameState.enemies) {
                const dist = Math.sqrt(
                    Math.pow(enemy.x - tower.x, 2) + 
                    Math.pow(enemy.y - tower.y, 2)
                );
                if (dist <= tower.range) {
                    return enemy;
                }
            }
            return null;
        }
        
        function showGameOver() {
            const overlay = document.getElementById('message-overlay');
            const text = document.getElementById('message-text');
            const buttons = document.getElementById('message-buttons');
            
            overlay.classList.add('active');
            text.textContent = '💀 游戏失败！\n核心被摧毁了';
            buttons.innerHTML = '';
            
            const restartBtn = document.createElement('button');
            restartBtn.className = 'message-btn danger';
            restartBtn.textContent = '🔄 重新开始';
            restartBtn.onclick = restartGame;
            buttons.appendChild(restartBtn);
        }
        
        function showVictory() {
            const overlay = document.getElementById('message-overlay');
            const text = document.getElementById('message-text');
            const buttons = document.getElementById('message-buttons');
            
            overlay.classList.add('active');
            text.textContent = '🎉 胜利！\n成功击败了Boss！';
            buttons.innerHTML = '';
            
            const restartBtn = document.createElement('button');
            restartBtn.className = 'message-btn success';
            restartBtn.textContent = '🏆 再玩一次';
            restartBtn.onclick = restartGame;
            buttons.appendChild(restartBtn);
        }
        
        function restartGame() {
            gameState = {
                gold: 200,
                coreHp: 1000,
                coreMaxHp: 1000,
                wave: 0,
                maxWave: 12,
                preparationTime: 30,
                waveActive: false,
                gameStarted: false,
                enemies: [],
                towers: [],
                selectedTowerType: null,

                gameOver: false,
                victory: false,
                spawnTimer: 0,
                enemiesSpawned: 0,
                enemiesPerWave: 0
            };
            document.getElementById('message-overlay').classList.remove('active');
            showToast('游戏已重置');
            updateUI();
        }
