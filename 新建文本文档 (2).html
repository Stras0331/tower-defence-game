<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>极简塔防 - 手机版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 500px;
            height: 100vh;
            background: #ecf0f1;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }
        
        .tower-btn {
            padding: 8px 12px;
            border: 2px solid #fff;
            border-radius: 5px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            min-width: 60px;
        }
        
        .tower-btn.selected {
            border-color: #f1c40f;
            box-shadow: 0 0 10px #f1c40f;
        }
        
        #info-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-align: center;
            display: none;
            z-index: 100;
        }
        
        .shop-btn {
            padding: 5px 8px;
            background: #e67e22;
            border: 1px solid #fff;
            border-radius: 3px;
            color: #fff;
            font-size: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="info-bar">
            <span id="gold">💰 200</span>
            <span id="wave">🌊 波次: 0</span>
            <span id="core-hp">❤️ 1000</span>
        </div>
        <div id="ui-overlay">
            <!-- 动态生成按钮 -->
        </div>
        <div id="message"></div>
    </div>
    
    <script>
        // 游戏配置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 响应式canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 游戏常量
        const GRID_SIZE = 40;
        const COLS = 10;
        const ROWS = 15;
        
        // 塔台类型
        const TOWER_TYPES = {
            CANNON: { name: '炮塔', cost: 100, color: '#3498db', type: 'attack' },
            SOLAR: { name: '太阳能', cost: 50, color: '#f1c40f', type: 'production' },
            SWORD: { name: '剑士', cost: 80, color: '#e74c3c', type: 'melee' },
            WALL: { name: '城墙', cost: 40, color: '#95a5a6', type: 'defense' },
            ICE: { name: '冰冻', cost: 120, color: '#1abc9c', type: 'slow' },
            SNIPER: { name: '狙击', cost: 150, color: '#9b59b6', type: 'sniper' }
        };
        
        // 敌人类型
        const ENEMY_TYPES = {
            INFANTRY: { name: '步兵', hp: 50, speed: 1, reward: 20, color: '#2ecc71', size: 8 },
            RUNNER: { name: '快速兵', hp: 30, speed: 2, reward: 25, color: '#3498db', size: 6 },
            TANK: { name: '重装兵', hp: 150, speed: 0.5, reward: 40, color: '#7f8c8d', size: 12 },
            ELITE_WARRIOR: { name: '精英战士', hp: 200, speed: 1.2, reward: 80, color: '#e67e22', size: 10 },
            ELITE_TANK: { name: '精英坦克', hp: 400, speed: 0.4, reward: 100, color: '#8e44ad', size: 15 },
            BOSS: { name: 'Boss', hp: 2000, speed: 0.3, reward: 1000, color: '#c0392b', size: 25 }
        };
        
        // 游戏状态
        let gameState = {
            gold: 200,
            coreHp: 1000,
            coreMaxHp: 1000,
            wave: 0,
            maxWave: 12,
            preparationTime: 30,
            waveActive: false,
            enemies: [],
            towers: [],
            selectedTowerType: null,
            selectedTower: null,
            gameOver: false,
            victory: false,
            spawnTimer: 0,
            enemiesSpawned: 0,
            enemiesPerWave: 0
        };
        
        // 路径定义
        const path = [
            { x: 0, y: 2 },
            { x: 2, y: 2 },
            { x: 2, y: 5 },
            { x: 4, y: 5 },
            { x: 4, y: 2 },
            { x: 6, y: 2 },
            { x: 6, y: 8 },
            { x: 3, y: 8 },
            { x: 3, y: 11 },
            { x: 5, y: 11 },
            { x: 5, y: 13 }
        ];
        
        // 塔台类
        class Tower {
            constructor(type, gridX, gridY) {
                this.type = type;
                this.gridX = gridX;
                this.gridY = gridY;
                this.level = 1;
                this.x = gridX * GRID_SIZE + GRID_SIZE / 2;
                this.y = gridY * GRID_SIZE + GRID_SIZE / 2;
                this.attackCooldown = 0;
                
                const config = TOWER_TYPES[type];
                this.maxHp = 100;
                this.hp = 100;
                this.defense = 5;
                
                switch(type) {
                    case 'CANNON':
                        this.attack = 20;
                        this.attackSpeed = 1;
                        this.range = 120;
                        break;
                    case 'SOLAR':
                        this.productionRate = 10;
                        this.productionSpeed = 2;
                        break;
                    case 'SWORD':
                        this.attack = 35;
                        this.attackSpeed = 1.5;
                        this.range = 40;
                        this.hp = 150;
                        this.maxHp = 150;
                        this.defense = 10;
                        break;
                    case 'WALL':
                        this.hp = 300;
                        this.maxHp = 300;
                        this.defense = 30;
                        break;
                    case 'ICE':
                        this.attack = 10;
                        this.attackSpeed = 0.8;
                        this.range = 100;
                        this.slowEffect = 0.5;
                        break;
                    case 'SNIPER':
                        this.attack = 50;
                        this.attackSpeed = 0.5;
                        this.range = 200;
                        break;
                }
            }
            
            upgrade() {
                if (this.level < 3) {
                    this.level++;
                    this.maxHp *= 2;
                    this.hp = this.maxHp;
                    if (this.attack) this.attack *= 2;
                    if (this.attackSpeed) this.attackSpeed *= 2;
                    if (this.range) this.range *= 1.5;
                    if (this.productionRate) this.productionRate *= 2;
                    if (this.productionSpeed) this.productionSpeed *= 2;
                    this.defense *= 2;
                    return true;
                }
                return false;
            }
            
            takeDamage(damage) {
                const actualDamage = Math.max(1, damage - this.defense);
                this.hp -= actualDamage;
                return this.hp > 0;
            }
        }
        
        // 敌人类
        class Enemy {
            constructor(type, wave) {
                this.type = type;
                const config = ENEMY_TYPES[type];
                const waveMultiplier = 1 + (wave - 1) * 0.2;
                
                this.maxHp = config.hp * waveMultiplier;
                this.hp = this.maxHp;
                this.speed = config.speed;
                this.attack = type === 'BOSS' ? 100 : (type.includes('ELITE') ? 30 : 10);
                this.reward = config.reward;
                this.size = config.size;
                this.color = config.color;
                this.defense = type === 'BOSS' ? 20 : (type.includes('ELITE') ? 10 : 0);
                
                this.pathIndex = 0;
                this.x = path[0].x * GRID_SIZE + GRID_SIZE / 2;
                this.y = path[0].y * GRID_SIZE + GRID_SIZE / 2;
                this.alive = true;
                this.reachedCore = false;
                this.slowTimer = 0;
                this.originalSpeed = this.speed;
                this.targetTower = null;
                this.attackCooldown = 0;
            }
            
            move(towers) {
                if (this.slowTimer > 0) {
                    this.slowTimer--;
                    if (this.slowTimer === 0) {
                        this.speed = this.originalSpeed;
                    }
                }
                
                if (this.pathIndex < path.length - 1) {
                    // 检查是否在攻击塔台
                    if (this.targetTower && this.targetTower.hp > 0) {
                        if (this.attackCooldown <= 0) {
                            this.targetTower.takeDamage(this.attack);
                            this.attackCooldown = 60;
                            if (this.targetTower.hp <= 0) {
                                this.targetTower = null;
                            }
                        } else {
                            this.attackCooldown--;
                        }
                        return;
                    }
                    
                    // 检查路径上的城墙
                    for (const tower of towers) {
                        if (tower.type === 'WALL') {
                            const dist = Math.sqrt(
                                Math.pow(tower.x - this.x, 2) + 
                                Math.pow(tower.y - this.y, 2)
                            );
                            if (dist < 40) {
                                this.targetTower = tower;
                                return;
                            }
                        }
                    }
                    
                    const target = path[this.pathIndex + 1];
                    const targetX = target.x * GRID_SIZE + GRID_SIZE / 2;
                    const targetY = target.y * GRID_SIZE + GRID_SIZE / 2;
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist <= this.speed) {
                        this.x = targetX;
                        this.y = targetY;
                        this.pathIndex++;
                        if (this.pathIndex >= path.length - 1) {
                            this.reachedCore = true;
                        }
                    } else {
                        this.x += (dx / dist) * this.speed;
                        this.y += (dy / dist) * this.speed;
                    }
                }
            }
            
            takeDamage(damage) {
                const actualDamage = Math.max(1, damage - this.defense);
                this.hp -= actualDamage;
            }
        }
        
        // 初始化UI
        function initUI() {
            const uiOverlay = document.getElementById('ui-overlay');
            uiOverlay.innerHTML = '';
            
            for (const [type, config] of Object.entries(TOWER_TYPES)) {
                const btn = document.createElement('div');
                btn.className = 'tower-btn';
                btn.style.backgroundColor = config.color;
                btn.textContent = `${config.name} $${config.cost}`;
                btn.onclick = () => selectTower(type);
                uiOverlay.appendChild(btn);
            }
            
            // 商店按钮
            const shopBtn = document.createElement('div');
            shopBtn.className = 'shop-btn';
            shopBtn.textContent = '商店';
            shopBtn.onclick = openShop;
            uiOverlay.appendChild(shopBtn);
            
            // 开始波次按钮
            const startBtn = document.createElement('div');
            startBtn.className = 'shop-btn';
            startBtn.style.backgroundColor = '#27ae60';
            startBtn.textContent = '开始波次';
            startBtn.onclick = startWave;
            uiOverlay.appendChild(startBtn);
        }
        
        function selectTower(type) {
            gameState.selectedTowerType = type;
            gameState.selectedTower = null;
            updateUI();
        }
        
        function openShop() {
            const shopItems = [
                { name: '金币+100', cost: 50, action: () => { gameState.gold += 100; } },
                { name: '攻击+50%', cost: 100, action: () => { 
                    gameState.towers.forEach(t => { if (t.attack) t.attack *= 1.5; }); 
                }},
                { name: '核心+300', cost: 75, action: () => { 
                    gameState.coreHp = Math.min(gameState.coreMaxHp, gameState.coreHp + 300); 
                }}
            ];
            
            // 简化的商店UI
            const message = document.getElementById('message');
            message.style.display = 'block';
            message.innerHTML = '商店<br>' + 
                shopItems.map((item, i) => 
                    `<button onclick="buyItem(${i})">${item.name} ($${item.cost})</button>`
                ).join('<br>') + 
                '<br><button onclick="closeShop()">关闭</button>';
        }
        
        function buyItem(index) {
            const shopItems = [
                { name: '金币+100', cost: 50, action: () => { gameState.gold += 100; } },
                { name: '攻击+50%', cost: 100, action: () => { 
                    gameState.towers.forEach(t => { if (t.attack) t.attack *= 1.5; }); 
                }},
                { name: '核心+300', cost: 75, action: () => { 
                    gameState.coreHp = Math.min(gameState.coreMaxHp, gameState.coreHp + 300); 
                }}
            ];
            
            const item = shopItems[index];
            if (gameState.gold >= item.cost) {
                gameState.gold -= item.cost;
                item.action();
            }
            closeShop();
        }
        
        function closeShop() {
            document.getElementById('message').style.display = 'none';
        }
        
        function updateUI() {
            document.getElementById('gold').textContent = `💰 ${Math.floor(gameState.gold)}`;
            document.getElementById('wave').textContent = `🌊 波次: ${gameState.wave}/${gameState.maxWave}`;
            document.getElementById('core-hp').textContent = `❤️ ${Math.floor(gameState.coreHp)}`;
            
            // 更新按钮选中状态
            const buttons = document.querySelectorAll('.tower-btn');
            buttons.forEach((btn, i) => {
                const types = Object.keys(TOWER_TYPES);
                if (types[i] === gameState.selectedTowerType) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }
        
        // 游戏逻辑
        function startWave() {
            if (!gameState.waveActive && !gameState.gameOver && !gameState.victory) {
                gameState.wave++;
                gameState.waveActive = true;
                gameState.enemies = [];
                gameState.enemiesSpawned = 0;
                gameState.spawnTimer = 0;
                
                if (gameState.wave === gameState.maxWave) {
                    gameState.enemiesPerWave = 1; // Boss波次
                } else {
                    gameState.enemiesPerWave = 5 + gameState.wave * 2;
                }
            }
        }
        
        function spawnEnemy() {
            let enemyType;
            const wave = gameState.wave;
            
            if (wave <= 3) {
                enemyType = ['INFANTRY', 'INFANTRY', 'RUNNER'][Math.floor(Math.random() * 3)];
            } else if (wave <= 6) {
                enemyType = ['INFANTRY', 'RUNNER', 'TANK'][Math.floor(Math.random() * 3)];
            } else if (wave <= 8) {
                enemyType = ['TANK', 'ELITE_WARRIOR', 'RUNNER'][Math.floor(Math.random() * 3)];
            } else if (wave <= 10) {
                enemyType = ['ELITE_WARRIOR', 'ELITE_TANK', 'TANK'][Math.floor(Math.random() * 3)];
            } else if (wave === 11) {
                enemyType = ['ELITE_WARRIOR', 'ELITE_TANK'][Math.floor(Math.random() * 2)];
            } else {
                enemyType = 'BOSS';
            }
            
            gameState.enemies.push(new Enemy(enemyType, wave));
        }
        
        function updateGame() {
            if (gameState.gameOver || gameState.victory) return;
            
            // 准备阶段
            if (!gameState.waveActive) {
                if (gameState.preparationTime > 0) {
                    gameState.preparationTime -= 1/60;
                    if (gameState.preparationTime <= 0) {
                        startWave();
                        gameState.preparationTime = 30;
                    }
                }
            } else {
                // 生成敌人
                gameState.spawnTimer++;
                if (gameState.enemiesSpawned < gameState.enemiesPerWave) {
                    const spawnInterval = gameState.wave === gameState.maxWave ? 1 : 30;
                    if (gameState.spawnTimer >= spawnInterval) {
                        spawnEnemy();
                        gameState.enemiesSpawned++;
                        gameState.spawnTimer = 0;
                    }
                }
                
                // 更新敌人
                for (const enemy of gameState.enemies) {
                    if (enemy.alive) {
                        enemy.move(gameState.towers);
                        if (enemy.reachedCore) {
                            gameState.coreHp -= enemy.attack;
                            enemy.alive = false;
                            if (gameState.coreHp <= 0) {
                                gameState.gameOver = true;
                                showMessage('游戏失败！');
                            }
                        } else if (enemy.hp <= 0) {
                            gameState.gold += enemy.reward;
                            enemy.alive = false;
                        }
                    }
                }
                
                // 移除死亡敌人
                gameState.enemies = gameState.enemies.filter(e => e.alive);
                
                // 塔台攻击
                updateTowers();
                
                // 检查波次完成
                if (gameState.enemiesSpawned >= gameState.enemiesPerWave && 
                    gameState.enemies.length === 0) {
                    gameState.waveActive = false;
                    gameState.preparationTime = 30;
                    if (gameState.wave >= gameState.maxWave) {
                        gameState.victory = true;
                        showMessage('胜利！击败了Boss！');
                    }
                }
            }
        }
        
        function updateTowers() {
            for (const tower of gameState.towers) {
                if (tower.attackCooldown > 0) {
                    tower.attackCooldown--;
                }
                
                if (tower.type === 'SOLAR') {
                    // 产能塔台
                    if (Math.random() < tower.productionSpeed / 60) {
                        gameState.gold += tower.productionRate;
                    }
                } else if (tower.type !== 'WALL') {
                    // 攻击塔台
                    if (tower.attackCooldown <= 0) {
                        const target = findTarget(tower);
                        if (target) {
                            // 攻击
                            target.takeDamage(tower.attack);
                            if (tower.type === 'ICE') {
                                target.slowTimer = 120;
                                target.originalSpeed = target.speed;
                                target.speed *= tower.slowEffect;
                            }
                            tower.attackCooldown = Math.floor(60 / tower.attackSpeed);
                        }
                    }
                }
            }
        }
        
        function findTarget(tower) {
            for (const enemy of gameState.enemies) {
                const dist = Math.sqrt(
                    Math.pow(enemy.x - tower.x, 2) + 
                    Math.pow(enemy.y - tower.y, 2)
                );
                if (dist <= tower.range) {
                    return enemy;
                }
            }
            return null;
        }
        
        function showMessage(text) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.style.display = 'block';
        }
        
        // 绘制函数
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 计算偏移以居中游戏区域
            const offsetX = (canvas.width - COLS * GRID_SIZE) / 2;
            const offsetY = 80; // 顶部留出空间给信息栏
            
            // 绘制背景
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制游戏区域
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(offsetX, offsetY, COLS * GRID_SIZE, ROWS * GRID_SIZE);
            
            // 绘制网格
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(offsetX + i * GRID_SIZE, offsetY);
                ctx.lineTo(offsetX + i * GRID_SIZE, offsetY + ROWS * GRID_SIZE);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(offsetX, offsetY + i * GRID_SIZE);
                ctx.lineTo(offsetX + COLS * GRID_SIZE, offsetY + i * GRID_SIZE);
                ctx.stroke();
            }
            
            // 绘制路径
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(offsetX + path[0].x * GRID_SIZE, offsetY + path[0].y * GRID_SIZE);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(offsetX + path[i].x * GRID_SIZE, offsetY + path[i].y * GRID_SIZE);
            }
            ctx.stroke();
            
            // 绘制核心
            const coreX = offsetX + 5 * GRID_SIZE;
            const coreY = offsetY + 13 * GRID_SIZE;
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(coreX, coreY, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('核心', coreX, coreY + 3);
            
            // 绘制塔台
            for (const tower of gameState.towers) {
                const x = offsetX + tower.gridX * GRID_SIZE;
                const y = offsetY + tower.gridY * GRID_SIZE;
                const config = TOWER_TYPES[tower.type];
                
                ctx.fillStyle = config.color;
                ctx.fillRect(x + 5, y + 5, GRID_SIZE - 10, GRID_SIZE - 10);
                
                // 显示等级
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(`L${tower.level}`, x + GRID_SIZE/2, y + GRID_SIZE/2);
                
                // 显示血量
                if (tower.hp < tower.maxHp) {
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillRect(x + 5, y - 5, (GRID_SIZE - 10) * (tower.hp / tower.maxHp), 3);
                }
            }
            
            // 绘制敌人
            for (const enemy of gameState.enemies) {
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x + offsetX, enemy.y + offsetY, enemy.size, 0, Math.PI * 2);
                ctx.fill();
                
                // 血条
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(enemy.x + offsetX - 15, enemy.y + offsetY - enemy.size - 10, 30, 4);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(enemy.x + offsetX - 15, enemy.y + offsetY - enemy.size - 10, 
                            30 * (enemy.hp / enemy.maxHp), 4);
            }
            
            // 绘制准备时间
            if (!gameState.waveActive && !gameState.gameOver && !gameState.victory) {
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`准备: ${Math.ceil(gameState.preparationTime)}s`, 
                           canvas.width / 2, offsetY + ROWS * GRID_SIZE / 2);
            }
            
            updateUI();
        }
        
        // 触摸处理
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const offsetX = (canvas.width - COLS * GRID_SIZE) / 2;
            const offsetY = 80;
            
            if (x >= offsetX && x <= offsetX + COLS * GRID_SIZE &&
                y >= offsetY && y <= offsetY + ROWS * GRID_SIZE) {
                
                const gridX = Math.floor((x - offsetX) / GRID_SIZE);
                const gridY = Math.floor((y - offsetY) / GRID_SIZE);
                
                // 检查是否点击了已有塔台
                let clickedTower = null;
                for (const tower of gameState.towers) {
                    if (tower.gridX === gridX && tower.gridY === gridY) {
                        clickedTower = tower;
                        break;
                    }
                }
                
                if (clickedTower) {
                    gameState.selectedTower = clickedTower;
                    if (clickedTower.level < 3) {
                        const upgradeCost = TOWER_TYPES[clickedTower.type].cost * clickedTower.level;
                        if (gameState.gold >= upgradeCost) {
                            if (confirm(`升级到L${clickedTower.level + 1}？花费${upgradeCost}金币`)) {
                                gameState.gold -= upgradeCost;
                                clickedTower.upgrade();
                            }
                        }
                    }
                } else if (gameState.selectedTowerType) {
                    const config = TOWER_TYPES[gameState.selectedTowerType];
                    if (gameState.gold >= config.cost) {
                        gameState.towers.push(new Tower(gameState.selectedTowerType, gridX, gridY));
                        gameState.gold -= config.cost;
                        gameState.selectedTowerType = null;
                    }
                }
            }
        });
        
        // 游戏循环
        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // 初始化
        initUI();
        gameLoop();
    </script>
</body>
</html>
